<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Renta y Gastos Estable Anual</title>
<link rel="stylesheet" href="ingresos-pension.css">
<style>
body{padding:10px 10px 0}
.shell{position:sticky;top:0;z-index:20;background:#fff;border:1px solid #dbe5f0;border-radius:16px;padding:14px;margin:0 auto 8px;max-width:1100px;box-shadow:0 8px 22px #16324f0d}
.periodBar{display:grid;grid-template-columns:1fr;gap:8px}
.periodBar label{font-size:13px;color:#64748b;font-weight:700}
.periodBar select{width:100%;font-size:18px;line-height:1.2;padding:14px 16px;border-radius:14px;border:1px solid #d7e2ef;background:#fff;color:#152944}
.statusLine{font-size:13px;color:#64748b;margin-top:8px}
.frame{width:100%;height:calc(100vh - 124px);border:0;border-radius:16px;background:#fff}
@media(max-width:650px){body{padding:8px 8px 0}.shell{padding:12px}.periodBar select{font-size:16px}.frame{height:calc(100vh - 130px)}}
</style>
</head>
<body>
<div class="shell">
  <div class="periodBar">
    <label for="period">Año de ingresos para cálculo de renta</label>
    <select id="period" aria-label="Año de ingresos para cálculo de renta">
      <option value="2024">Ingresos 2024 -> Renta 2025</option>
      <option value="2025" selected>Ingresos 2025 -> Renta 2026</option>
      <option value="2026">Ingresos 2026 -> Renta 2027</option>
    </select>
  </div>
  <div id="status" class="statusLine">Ingresos 2025 -> Renta/AT 2026</div>
</div>
<iframe id="appFrame" class="frame" src="renta-gastos-v6.html?v=otros-ingresos-20260528-1"></iframe>
<script>
function taxYearFromIncomeYear(year){return Number(year)+1}
function periodLabel(year){return 'Ingresos '+year+' -> Renta/AT '+taxYearFromIncomeYear(year)}
function applyPeriod(){
  const year=document.getElementById('period').value;
  const at=taxYearFromIncomeYear(year);
  const frame=document.getElementById('appFrame');
  document.getElementById('status').textContent=periodLabel(year);
  try{
    const doc=frame.contentDocument||frame.contentWindow.document;
    const app=frame.contentWindow.App;
    ['at','dashAT'].forEach(id=>{
      const el=doc.getElementById(id);
      if(el){
        el.value=at;
        el.dispatchEvent(new Event('change',{bubbles:true}));
      }
    });
    if(app&&app.setAT)app.setAT(String(at));
    if(app&&app.draw)app.draw();
  }catch(e){
    document.getElementById('status').textContent='Cargando '+periodLabel(year);
  }
}
document.getElementById('period').addEventListener('change',applyPeriod);
document.getElementById('appFrame').addEventListener('load',()=>setTimeout(applyPeriod,350));
applyPeriod();
</script>
</body>
</html>
